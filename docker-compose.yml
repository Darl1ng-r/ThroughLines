version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: throughlines_app
    ports:
      - "80:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_UPSTASH_REDIS_REST_URL=http://redis:6379
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: throughlines_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
